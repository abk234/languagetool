# Local LanguageTool HTTP server via community image (erikvl87/languagetool).
# Upstream Java monorepo has no official compose; this is fork-only ops glue.
# API: POST http://127.0.0.1:${LANGUAGETOOL_PORT:-8010}/v2/check
services:
  languagetool:
    image: ${LANGUAGETOOL_IMAGE:-erikvl87/languagetool:latest}
    container_name: languagetool
    restart: unless-stopped
    ports:
      - "${LANGUAGETOOL_PORT:-8010}:8010"
    environment:
      Java_Xms: ${Java_Xms:-256m}
      Java_Xmx: ${Java_Xmx:-512m}
      # Optional n-gram language model (mount ./ngrams and set path)
      # langtool_languageModel: /ngrams
    # volumes:
    #   - ./ngrams:/ngrams:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --post-data='language=en-US&text=test' http://127.0.0.1:8010/v2/check >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
